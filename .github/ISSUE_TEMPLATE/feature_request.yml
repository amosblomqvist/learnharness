name: Feature request
description: Suggest a new feature or an improvement.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Ideas are welcome; you do not need a finished design or implementation plan. A request opens a discussion, not a commitment to build it.

        **This report is public.** Do not include credentials or private information.
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
      description: Describe your idea and the problem it would help you solve.
    validations:
      required: true
