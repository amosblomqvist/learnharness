name: Question
description: Ask about using LearnHarness.
labels: [question]
body:
  - type: markdown
    attributes:
      value: |
        **This report is public.** Do not include credentials or private information.
  - type: textarea
    id: question
    attributes:
      label: What is your question?
      description: Include any relevant context. Version, OS, provider or model details can help when they relate to your question.
    validations:
      required: true
