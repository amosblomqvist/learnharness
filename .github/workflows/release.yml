name: Desktop release

on:
  push:
    tags: ["v*"]
  # Manual runs are artifact-only, unsigned, and NEVER create a release.
  # Both Mac architectures are finalized together, without release uploads.
  workflow_dispatch:

permissions:
  contents: read

# Serialize separate runs for the same ref; never cancel an upload in flight.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Release gates
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - name: Tag must match package.json
        if: github.event_name == 'push'
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const {version} = JSON.parse(fs.readFileSync("package.json", "utf8"));
            if (process.env.GITHUB_REF_NAME !== `v${version}`) {
              console.error("Release tag must equal v" + version);
              process.exit(1);
            }
          '
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint

  draft:
    name: Prepare one draft
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      # This job succeeds without creating anything on manual rehearsals.
      # Preparing once avoids the publisher's list-miss/create race between OS jobs.
      - name: Create or reuse the tag's draft
        if: github.event_name == 'push'
        uses: actions/github-script@v9
        with:
          script: |
            const {owner, repo} = context.repo;
            const tag = context.ref.replace(/^refs\/tags\//, "");
            const version = tag.slice(1);
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner, repo, per_page: 100,
            });
            const matches = releases.filter(release =>
              release.tag_name === tag || release.tag_name === version);
            if (matches.length > 1) {
              throw new Error(`Multiple releases match ${tag}; resolve them before uploading.`);
            }
            if (matches.length === 1) {
              if (!matches[0].draft) {
                throw new Error(`${tag} is already published; refusing to modify it.`);
              }
              core.info(`Reusing draft ${matches[0].id} for ${tag}`);
              return;
            }
            const {data} = await github.rest.repos.createRelease({
              owner, repo, tag_name: tag, name: version, draft: true,
            });
            core.info(`Created draft ${data.id} for ${tag}`);

  package:
    name: Package (${{ matrix.platform }})
    needs: [quality, draft]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            platform: mac-arm64
            builder_args: --mac --arm64
            app_dir: mac-arm64
          - os: macos-15-intel
            platform: mac-x64
            builder_args: --config electron-builder.mac-x64.yml --mac --x64
            app_dir: mac
          - os: windows-2025
            platform: windows-x64
            builder_args: --win --x64
          - os: ubuntu-24.04
            platform: linux-x64
            builder_args: --linux --x64
    runs-on: ${{ matrix.os }}
    # Apple's notarization queue has taken ~2 hours for this team.
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      # Only arm64 compiles Icon Composer (macOS 26 + Xcode 26).
      # Intel uses the existing static icns, including on macOS 15.
      - name: Select Xcode 26+ for actool (arm64 icon compile)
        if: matrix.platform == 'mac-arm64'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: npm ci
      - name: Native renderer tests on this OS
        run: npx electron --import tsx --test tests/pdf-native-render.test.ts tests/pdf-ops.test.ts tests/svg-native-render.test.ts tests/browser-service.test.ts
        env:
          NODE_ENV: test
          ELECTRON_RUN_AS_NODE: "1"
      - run: npm run build
      # Check the fresh trace before any static copying/curation.
      - run: node scripts/smoke-provider-runtime.mjs
      - run: node scripts/build-server.mjs
      - run: node scripts/smoke-server.mjs --electron
      - name: Validate macOS release secrets
        if: github.event_name == 'push' && runner.os == 'macOS'
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing signing/notarization secret: $name"
              exit 1
            fi
          done
      - name: Signed and notarized macOS release (stage only)
        if: github.event_name == 'push' && runner.os == 'macOS'
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx electron-builder ${{ matrix.builder_args }} --publish never -c.forceCodeSigning=true
      - name: Windows/Linux release → draft
        if: github.event_name == 'push' && runner.os != 'macOS'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder ${{ matrix.builder_args }} --publish always
      - name: Unsigned macOS rehearsal (no publish, no notarization)
        if: github.event_name == 'workflow_dispatch' && runner.os == 'macOS'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder ${{ matrix.builder_args }} --publish never -c.mac.notarize=false
      - name: Windows/Linux rehearsal (no publish)
        if: github.event_name == 'workflow_dispatch' && runner.os != 'macOS'
        run: npx electron-builder ${{ matrix.builder_args }} --publish never
      - name: Initialize packaged providers offline (host and packaged Electron Node)
        run: |
          case "$RUNNER_OS" in
            macOS)
              app="dist/${{ matrix.app_dir }}/LearnHarness.app/Contents"
              payload="$app/Resources/server/standalone"
              runtime="$app/MacOS/LearnHarness"
              ;;
            Windows)
              payload="dist/win-unpacked/resources/server/standalone"
              runtime="dist/win-unpacked/LearnHarness.exe"
              ;;
            Linux)
              payload="dist/linux-unpacked/resources/server/standalone"
              runtime="dist/linux-unpacked/learnharness"
              ;;
          esac
          node scripts/smoke-provider-runtime.mjs --standalone "$payload"
          node scripts/smoke-provider-runtime.mjs --standalone "$payload" --runtime "$runtime"
      - name: Exercise packaged demo runtime (own Electron, no system Chrome)
        run: |
          case "$RUNNER_OS" in
            macOS)
              app="dist/${{ matrix.app_dir }}/LearnHarness.app/Contents"
              node scripts/smoke-demo-runtime.mjs --standalone "$app/Resources/server/standalone" --runtime "$app/MacOS/LearnHarness" --browser
              ;;
            Windows)
              node scripts/smoke-demo-runtime.mjs --standalone dist/win-unpacked/resources/server/standalone --runtime dist/win-unpacked/LearnHarness.exe --browser
              ;;
            Linux)
              xvfb-run -a node scripts/smoke-demo-runtime.mjs --standalone dist/linux-unpacked/resources/server/standalone --runtime dist/linux-unpacked/learnharness --browser
              ;;
          esac
      - name: Save installers and update metadata
        uses: actions/upload-artifact@v7
        with:
          name: learnharness-${{ matrix.platform }}
          retention-days: 7
          if-no-files-found: error
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.blockmap
            dist/latest*.yml

  # One writer for macOS: neither architecture job uploads to GitHub Releases.
  # Download into separate directories so partial latest-mac.yml files cannot
  # overwrite each other. This runs for rehearsals too, proving finalization.
  finalize-mac:
    name: Finalize macOS update feed
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: learnharness-mac-arm64
          path: dist/mac-input/arm64
      - uses: actions/download-artifact@v8
        with:
          name: learnharness-mac-x64
          path: dist/mac-input/x64
      - name: Validate artifacts and combine both architectures
        run: npx tsx scripts/finalize-mac-update.ts dist/mac-input/arm64 dist/mac-input/x64 dist/mac-update
      - uses: actions/upload-artifact@v7
        with:
          name: learnharness-mac-combined
          path: dist/mac-update/*
          retention-days: 7
          if-no-files-found: error
      - name: Upload macOS artifacts then the complete feed to the single draft
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          npx tsx scripts/verify-release.ts select "$RUNNER_TEMP/releases.json" --tag "$GITHUB_REF_NAME" > "$RUNNER_TEMP/draft.json"
          tag=$(node -e 'console.log(JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).matchedTagName)' "$RUNNER_TEMP/draft.json")
          gh release upload "$tag" dist/mac-update/*.dmg dist/mac-update/*.zip dist/mac-update/*.blockmap --clobber
          gh release upload "$tag" dist/mac-update/latest-mac.yml --clobber

  # Read-only final gate: exactly 15 assets, with both macOS architectures
  # in the single combined feed. Manual rehearsals create no draft.
  verify:
    name: Verify draft release
    needs: [package, finalize-mac]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # GitHub hides drafts from tokens without push access. The commands below
    # remain GET-only; expose this token only to the two API-reading steps.
    permissions:
      contents: write
    steps:
      # The tagged revision — verify exactly what was packaged, not a moving default.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - name: List every release, drafts included
        env:
          GH_TOKEN: ${{ github.token }}
        # --slurp wraps the paginated pages into one JSON document
        # ([[release,...],[release,...]]); the validator flattens it.
        run: gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
      - name: Select the tag's single draft
        # Machine JSON on stdout (release id + asset ids); warnings on stderr.
        run: npx tsx scripts/verify-release.ts select "$RUNNER_TEMP/releases.json" --tag "$GITHUB_REF_NAME" > "$RUNNER_TEMP/draft.json"
      - name: Download the three update feeds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/metadata"
          for name in latest-mac.yml latest.yml latest-linux.yml; do
            id=$(DRAFT="$RUNNER_TEMP/draft.json" NAME="$name" node -e '
              const fs = require("node:fs");
              const draft = JSON.parse(fs.readFileSync(process.env.DRAFT, "utf8"));
              const asset = draft.assets.find((entry) => entry.name === process.env.NAME);
              if (asset == null) { console.error("draft has no " + process.env.NAME); process.exit(1); }
              console.log(asset.id);
            ')
            gh api "repos/$GITHUB_REPOSITORY/releases/assets/$id" -H "Accept: application/octet-stream" > "$RUNNER_TEMP/metadata/$name"
            echo "downloaded $name ($(wc -c < "$RUNNER_TEMP/metadata/$name") bytes)"
          done
      - name: Verify draft assets and update feeds
        run: npx tsx scripts/verify-release.ts verify "$RUNNER_TEMP/releases.json" "$RUNNER_TEMP/metadata" --tag "$GITHUB_REF_NAME"
