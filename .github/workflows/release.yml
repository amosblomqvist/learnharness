name: Desktop release

on:
  push:
    tags: ["v*"]
  # Manual runs are artifact-only, unsigned, and NEVER create or publish a release.
  # Use this for the Windows dress rehearsal (build + smoke, no upload to Releases).
  workflow_dispatch:

permissions:
  contents: read

# Serialize separate runs for the same ref; never cancel an upload in flight.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Release gates
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - name: Tag must match package.json
        if: github.event_name == 'push'
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const {version} = JSON.parse(fs.readFileSync("package.json", "utf8"));
            if (process.env.GITHUB_REF_NAME !== `v${version}`) {
              console.error("Release tag must equal v" + version);
              process.exit(1);
            }
          '
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint

  draft:
    name: Prepare one draft
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      # This job succeeds without creating anything on manual rehearsals.
      # Preparing once avoids the publisher's list-miss/create race between packaging jobs.
      - name: Create or reuse the tag's draft
        if: github.event_name == 'push'
        uses: actions/github-script@v9
        with:
          script: |
            const {owner, repo} = context.repo;
            const tag = context.ref.replace(/^refs\/tags\//, "");
            const version = tag.slice(1);
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner, repo, per_page: 100,
            });
            const matches = releases.filter(release =>
              release.tag_name === tag || release.tag_name === version);
            if (matches.length > 1) {
              throw new Error(`Multiple releases match ${tag}; resolve them before uploading.`);
            }
            if (matches.length === 1) {
              if (!matches[0].draft) {
                throw new Error(`${tag} is already published; refusing to modify it.`);
              }
              core.info(`Reusing draft ${matches[0].id} for ${tag}`);
              return;
            }
            const {data} = await github.rest.repos.createRelease({
              owner, repo, tag_name: tag, name: version, draft: true,
            });
            core.info(`Created draft ${data.id} for ${tag}`);

  package:
    name: Package (${{ matrix.platform }})
    needs: [quality, draft]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            platform: windows-x64
            builder_args: --win --x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - name: Native renderer tests on this OS
        run: npx electron --import tsx --test tests/pdf-native-render.test.ts tests/pdf-ops.test.ts tests/svg-native-render.test.ts tests/browser-service.test.ts
        env:
          NODE_ENV: test
          ELECTRON_RUN_AS_NODE: "1"
      - run: npm run build
      # Check the fresh trace before any static copying/curation.
      - run: node scripts/smoke-provider-runtime.mjs
      - run: node scripts/build-server.mjs
      - run: node scripts/smoke-server.mjs --electron
      - name: Windows release → draft
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder ${{ matrix.builder_args }} --publish always
      - name: Windows rehearsal (no publish)
        if: github.event_name == 'workflow_dispatch'
        run: npx electron-builder ${{ matrix.builder_args }} --publish never
      # The product name has a space, so the executable name is quoted.
      - name: Initialize packaged providers offline (host and packaged Electron Node)
        run: |
          payload="dist/win-unpacked/resources/server/standalone"
          runtime="dist/win-unpacked/LearnHarness Fork.exe"
          node scripts/smoke-provider-runtime.mjs --standalone "$payload"
          node scripts/smoke-provider-runtime.mjs --standalone "$payload" --runtime "$runtime"
      - name: Exercise packaged demo runtime (own Electron, no system Chrome)
        run: node scripts/smoke-demo-runtime.mjs --standalone dist/win-unpacked/resources/server/standalone --runtime "dist/win-unpacked/LearnHarness Fork.exe" --browser
      - name: Save installers and update metadata
        uses: actions/upload-artifact@v7
        with:
          name: learnharness-${{ matrix.platform }}
          retention-days: 7
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml

  # The last gate before publishing: after the packaging job has uploaded,
  # fail the run unless the tag's single draft release holds exactly the
  # 3 verified assets (the NSIS installer, its blockmap, and latest.yml) and
  # latest.yml references the installer by exact name at the package.json
  # version. This job is read-only: it never creates, edits, publishes, or
  # deletes anything. Only when it passes does the publish job below publish
  # the draft. Manual rehearsals upload nothing, so there is no draft to
  # verify and the job stays skipped.
  verify:
    name: Verify draft release
    needs: package
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      release_id: ${{ steps.draft_id.outputs.release_id }}
    # GitHub hides drafts from tokens without push access. The commands below
    # remain GET-only; expose this token only to the two API-reading steps.
    permissions:
      contents: write
    steps:
      # The tagged revision — verify exactly what was packaged, not a moving default.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - name: List every release, drafts included
        env:
          GH_TOKEN: ${{ github.token }}
        # --slurp wraps the paginated pages into one JSON document
        # ([[release,...],[release,...]]); the validator flattens it.
        run: gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
      - name: Select the tag's single draft
        # Machine JSON on stdout (release id + asset ids); warnings on stderr.
        run: npx tsx scripts/verify-release.ts select "$RUNNER_TEMP/releases.json" --tag "$GITHUB_REF_NAME" > "$RUNNER_TEMP/draft.json"
      # Hands the selected draft's id to the publish job. No token, no API call.
      - name: Expose the draft's release id
        id: draft_id
        run: |
          id=$(DRAFT="$RUNNER_TEMP/draft.json" node -e '
            const fs = require("node:fs");
            const draft = JSON.parse(fs.readFileSync(process.env.DRAFT, "utf8"));
            if (!Number.isInteger(draft.releaseId) || draft.releaseId <= 0) { console.error("draft.json has no release id"); process.exit(1); }
            console.log(draft.releaseId);
          ')
          echo "release_id=$id" >> "$GITHUB_OUTPUT"
      - name: Download the update feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/metadata"
          name=latest.yml
          id=$(DRAFT="$RUNNER_TEMP/draft.json" NAME="$name" node -e '
            const fs = require("node:fs");
            const draft = JSON.parse(fs.readFileSync(process.env.DRAFT, "utf8"));
            const asset = draft.assets.find((entry) => entry.name === process.env.NAME);
            if (asset == null) { console.error("draft has no " + process.env.NAME); process.exit(1); }
            console.log(asset.id);
          ')
          gh api "repos/$GITHUB_REPOSITORY/releases/assets/$id" -H "Accept: application/octet-stream" > "$RUNNER_TEMP/metadata/$name"
          echo "downloaded $name ($(wc -c < "$RUNNER_TEMP/metadata/$name") bytes)"
      - name: Verify draft assets and update feed
        run: npx tsx scripts/verify-release.ts verify "$RUNNER_TEMP/releases.json" "$RUNNER_TEMP/metadata" --tag "$GITHUB_REF_NAME"

  # Publishes the draft that the verify job just checked. It runs only after
  # verify passes, and makes exactly one API call: updateRelease on that
  # draft's id. It never creates or deletes a release and never touches assets.
  # make_latest is explicit because electron-updater reads releases/latest.
  publish:
    name: Publish verified release
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Publish the verified draft
        uses: actions/github-script@v9
        env:
          RELEASE_ID: ${{ needs.verify.outputs.release_id }}
        with:
          script: |
            const {owner, repo} = context.repo;
            const release_id = Number(process.env.RELEASE_ID);
            if (!Number.isInteger(release_id) || release_id <= 0) {
              throw new Error(`Invalid release id: ${process.env.RELEASE_ID}`);
            }
            await github.rest.repos.updateRelease({
              owner, repo, release_id, draft: false, make_latest: "true",
            });
            core.info(`Published release ${release_id}`);
