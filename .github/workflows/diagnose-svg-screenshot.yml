name: Diagnose SVG screenshot (not a release gate)

on:
  push:
    branches: [diagnostics/svg-screenshot-060]

permissions:
  contents: read

concurrency:
  group: diagnose-svg-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-helper:
    name: Native readback telemetry (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Two owned source helpers per OS; no product edit or release gate change.
        os: [windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      LH_IGNORE_ENV_KEYS: "1"
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
      - name: Preserve two pinned native telemetry files outside checkout
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          import {execFileSync} from 'node:child_process';
          const baseline = 'a917e2ee2981fd534aa61a1ed62bfb7b413f2ec4';
          const root = path.join(process.env.RUNNER_TEMP, 'lh-svg-diagnostic');
          fs.mkdirSync(root, {recursive: true});
          // Git blob bytes avoid Windows worktree CRLF conversion.
          const files = [
            {source: 'scripts/diagnose-native-readback.mjs', name: 'native-readback.mjs', sha256: 'a263ecb51799702c31fb2c6c4d70e8663499954a49b467cea0fabe266042135e'},
            {source: 'scripts/diagnose-native-observer.cjs', name: 'native-observer.cjs', sha256: 'ae8a6874a1e231b75fa5c233a806d4f95bec0f4ae82c54b62e4918d7f33c57fc'},
          ];
          for (const file of files) {
            const bytes = execFileSync('git', ['show', `HEAD:${file.source}`]);
            assert.equal(crypto.createHash('sha256').update(bytes).digest('hex'), file.sha256);
            fs.writeFileSync(path.join(root, file.name), bytes);
          }
          const data = path.join(root, 'data');
          fs.mkdirSync(data, {recursive: true});
          const auth = path.join(root, 'empty-auth.json');
          fs.writeFileSync(auth, '{}\n');
          fs.writeFileSync(path.join(root, 'metadata.json'), JSON.stringify({
            baseline, diagnosticCommit: process.env.GITHUB_SHA, files,
            platform: process.platform, node: process.versions.node,
            purpose: 'Native frame/readback diagnostic only. Original failure remains a failure even if a later control recovers; never a release gate.',
            screenshotProtocolTimeoutMs: 10000, nativeIPCDeadlineMs: 1500, maximumHelpersPerOS: 2,
            harnessOnlyForcedControls: false,
          }, null, 2) + '\n');
          fs.appendFileSync(process.env.GITHUB_ENV, [
            ['DIAG_ROOT', root],
            ['TMPDIR', root], ['TEMP', root], ['TMP', root],
            ['LH_DATA_DIR', data], ['LH_AUTH_FILE', auth],
          ].map(([key, value]) => `${key}=${value}\n`).join(''));
          NODE
      - name: Use exact frozen release source (no diagnostic product edits)
        uses: actions/checkout@v7
        with:
          ref: a917e2ee2981fd534aa61a1ed62bfb7b413f2ec4
          fetch-depth: 1
          persist-credentials: false
      - name: Assert frozen source identity
        run: test "$(git rev-parse HEAD)" = a917e2ee2981fd534aa61a1ed62bfb7b413f2ec4
      - name: Install locked dependencies only (no plugin setup, fonts or build)
        # Include dev dependencies despite the production runtime environment.
        run: npm ci --include=dev
      - name: Materialize the locked Electron binary (lazy installer)
        run: |
          node --input-type=commonjs -e 'const fs = require("node:fs"); const runtime = require("electron"); if (!fs.existsSync(runtime)) throw new Error("Locked Electron executable missing"); console.log("Locked Electron executable: " + runtime);'
      - name: Collect bounded native readback controls (not a release gate)
        run: |
          set -o pipefail
          runtime="$GITHUB_WORKSPACE/node_modules/electron/dist/electron"
          if [[ "$RUNNER_OS" == "Windows" ]]; then runtime="$runtime.exe"; fi
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            xvfb-run -a node "$DIAG_ROOT/native-readback.mjs" --checkout "$GITHUB_WORKSPACE" --runtime "$runtime" --observer "$DIAG_ROOT/native-observer.cjs" --out "$DIAG_ROOT/readback-output" 2>"$DIAG_ROOT/readback.stderr.log" | tee "$DIAG_ROOT/readback.stdout.ndjson"
          else
            node "$DIAG_ROOT/native-readback.mjs" --checkout "$GITHUB_WORKSPACE" --runtime "$runtime" --observer "$DIAG_ROOT/native-observer.cjs" --out "$DIAG_ROOT/readback-output" 2>"$DIAG_ROOT/readback.stderr.log" | tee "$DIAG_ROOT/readback.stdout.ndjson"
          fi
      - name: Preserve telemetry and synthetic captures, including failures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: svg-native-readback-${{ matrix.os }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            ${{ runner.temp }}/lh-svg-diagnostic/metadata.json
            ${{ runner.temp }}/lh-svg-diagnostic/*.stdout.ndjson
            ${{ runner.temp }}/lh-svg-diagnostic/*.stderr.log
            ${{ runner.temp }}/lh-svg-diagnostic/readback-output/**
