name: Build with Nix

on:
  push:
    branches: [main]
concurrency:
  group: nix-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.system }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            os: ubuntu-24.04
          - system: aarch64-linux
            os: ubuntu-24.04-arm
          - system: aarch64-darwin
            os: macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
    - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866
      with:
        name: learnharness
        authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
    - name: build with nix
      run: nix build -L .#packages.${{ matrix.system }}.default