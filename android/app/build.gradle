plugins { id 'com.android.application' }

android {
    namespace 'ar.com.learnharness'
    compileSdk 35
    ndkVersion '28.0.13004108'
    defaultConfig {
        applicationId 'ar.com.learnharness'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.4.1-android.1'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
        externalNativeBuild { cmake { cppFlags '-std=c++17'; arguments '-DANDROID_STL=c++_shared' } }
    }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
    sourceSets.main {
        assets.srcDirs += '../.generated/assets'
    }
    buildFeatures { buildConfig true }
    splits { abi { enable true; reset(); include 'arm64-v8a', 'x86_64'; universalApk false } }
    buildTypes { release { minifyEnabled false } }
    packaging { jniLibs { useLegacyPackaging true } }
    androidResources { noCompress += ['zip'] }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { testImplementation 'junit:junit:4.13.2' }
