<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="color-scheme" content="light dark" />
		<title>LearnHarness phone proof</title>
		<style>
			:root { font-family: -apple-system, system-ui, sans-serif; line-height: 1.45; }
			body { margin: 0 auto; max-width: 720px; padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom)); }
			h1 { font-size: 1.25rem; margin: 0 0 4px; }
			p.note { margin: 0 0 16px; opacity: 0.7; font-size: 0.9rem; }
			fieldset { border: 1px solid #8884; border-radius: 12px; margin: 0 0 16px; padding: 12px; }
			legend { font-weight: 600; padding: 0 4px; }
			label { display: block; font-size: 0.85rem; margin: 8px 0 4px; }
			input, select, textarea, button { font: inherit; font-size: 16px; width: 100%; box-sizing: border-box; padding: 10px; border-radius: 10px; border: 1px solid #8886; }
			button { margin-top: 10px; background: #2563eb; color: white; border: 0; font-weight: 600; }
			button:disabled { opacity: 0.5; }
			#status { font-size: 0.85rem; white-space: pre-wrap; opacity: 0.8; }
			#output { white-space: pre-wrap; border-radius: 12px; padding: 12px; background: #8881; min-height: 3em; }
			.tool { font-size: 0.85rem; opacity: 0.75; border-left: 3px solid #2563eb; padding-left: 8px; margin-top: 8px; }
			ul { padding-left: 20px; }
		</style>
	</head>
	<body>
		<h1>LearnHarness: phone proof</h1>
		<p class="note">Phase 0. The real LearnHarness backend runs inside this page and stores everything on this device (IndexedDB). Your key is stored only on this device.</p>

		<fieldset>
			<legend>1. Provider key</legend>
			<label for="provider">Provider</label>
			<select id="provider"></select>
			<label for="key">API key</label>
			<input id="key" type="password" autocomplete="off" placeholder="sk-ant-…" />
			<button id="save-key">Save key</button>
		</fieldset>

		<fieldset>
			<legend>2. Model</legend>
			<label for="model">Model (used for all three slots)</label>
			<select id="model"></select>
			<button id="save-model">Use this model</button>
		</fieldset>

		<fieldset>
			<legend>3. Lesson turn</legend>
			<label for="prompt">What do you want to understand?</label>
			<textarea id="prompt" rows="3">Why does the sky look blue?</textarea>
			<button id="start">Start a lesson</button>
		</fieldset>

		<div id="status">Booting…</div>
		<h2 style="font-size:1rem">Agent output</h2>
		<div id="output"></div>

		<h2 style="font-size:1rem">Sessions stored on this device</h2>
		<ul id="sessions"></ul>

		<script type="module" src="./main.js"></script>
	</body>
</html>
